appId: app.receipts
name: Synthetic PDF month isolation
---
- launchApp:
    clearState: true
- tapOn:
    id: onboarding_get_started
- tapOn:
    id: nav_import
- tapOn:
    id: import_button
- tapOn:
    point: 7%,8%
- tapOn: Downloads
- tapOn: receipt_a.pdf
- extendedWaitUntil:
    visible:
      id: import_status_success
    timeout: 30000
- tapOn:
    id: import_button
- tapOn:
    point: 7%,8%
- tapOn: Downloads
- tapOn: receipt_b.pdf
- extendedWaitUntil:
    visible:
      id: import_status_success
    timeout: 30000
- tapOn:
    id: nav_month
- tapOn:
    id: month_picker
- tapOn:
    id: month_option_0
- extendedWaitUntil:
    visible:
      id: month_single_receipt
    timeout: 15000
- tapOn:
    id: month_picker
- tapOn:
    id: month_option_1
- extendedWaitUntil:
    visible:
      id: month_single_receipt
    timeout: 15000
