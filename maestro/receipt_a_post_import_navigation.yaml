appId: app.receipts
name: Redacted PDF post-import navigation
---
- launchApp:
    clearState: true
- tapOn:
    id: onboarding_get_started
- tapOn:
    id: nav_import
- tapOn:
    id: import_button
- tapOn:
    point: 7%,8%
- tapOn: Downloads
- tapOn: receipt_a.pdf
- extendedWaitUntil:
    visible:
      id: import_status_success
    timeout: 30000
- tapOn:
    id: nav_receipts
- extendedWaitUntil:
    visible:
      id: receipts_list
    timeout: 15000
- tapOn:
    id: nav_month
- extendedWaitUntil:
    visible:
      id: month_receipts
    timeout: 15000
